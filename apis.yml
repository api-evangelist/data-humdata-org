    name: Humanitarian Data Exchange CKAN Action API
    description: >-
      CKAN Action API for Humanitarian Data Exchange, a consistent JSON-over-HTTP interface over a catalog of 27,880 datasets. Standard actions include package_search, package_show, package_list, organization_list, group_list, tag_list, and resource_search; datastore_search is available where the DataStore extension is enabled. Base URL https://data.humdata.org/api/3/action/.
